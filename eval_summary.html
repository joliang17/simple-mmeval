<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluation Accuracy Summary</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #20242a;
      --muted: #68717d;
      --line: #d9dee7;
      --accent: #0f766e;
      --accent-soft: #e7f4f2;
      --warn: #9a3412;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 22px 28px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    main {
      padding: 18px 28px 28px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    input[type="search"] {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 9px;
      font: inherit;
    }

    .cb-dropdown {
      position: relative;
    }

    .cb-toggle {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 30px 7px 9px;
      font: inherit;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cb-toggle::after {
      content: "▾";
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
    }

    .cb-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      max-height: 260px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      z-index: 100;
      padding: 6px 0;
    }

    .cb-panel.open {
      display: block;
    }

    .cb-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 400;
      text-transform: none;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    .cb-panel label:hover {
      background: var(--accent-soft);
    }

    .cb-panel input[type="checkbox"] {
      width: 14px;
      min-height: unset;
      height: 14px;
      border: none;
      padding: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric .value {
      font-size: 22px;
      font-weight: 700;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #f0f3f7;
      color: #35404d;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    tbody tr:hover {
      background: var(--accent-soft);
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .path {
      color: var(--muted);
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-error {
      color: var(--warn);
      font-weight: 650;
    }

    @media (max-width: 880px) {
      header,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .toolbar,
      .summary {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .toolbar,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Evaluation Accuracy Summary</h1>
    <div class="meta">
      <span id="status">Loading eval_summary.csv</span>
      <span id="last-updated"></span>
      <span id="row-count"></span>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Filters">
      <label>
        Model / Run
        <div class="cb-dropdown" id="run-dropdown">
          <button type="button" class="cb-toggle" id="run-toggle">All runs</button>
          <div class="cb-panel" id="run-panel"></div>
        </div>
      </label>
      <label>
        Benchmark
        <div class="cb-dropdown" id="dataset-dropdown">
          <button type="button" class="cb-toggle" id="dataset-toggle">All benchmarks</button>
          <div class="cb-panel" id="dataset-panel"></div>
        </div>
      </label>
      <label>
        Search
        <input id="search-filter" type="search" placeholder="Filter table text">
      </label>
      <label>
        Refresh
        <select id="refresh-interval">
          <option value="10000">Every 10s</option>
          <option value="30000" selected>Every 30s</option>
          <option value="60000">Every 60s</option>
          <option value="0">Manual</option>
        </select>
      </label>
    </section>

    <section class="summary" aria-label="Visible summary">
      <div class="metric">
        <div class="value" id="metric-runs">0</div>
        <div class="label">Runs</div>
      </div>
      <div class="metric">
        <div class="value" id="metric-benchmarks">0</div>
        <div class="label">Benchmarks</div>
      </div>
      <div class="metric">
        <div class="value" id="metric-samples">0</div>
        <div class="label">Samples</div>
      </div>
      <div class="metric">
        <div class="value" id="metric-accuracy">-</div>
        <div class="label">Weighted Accuracy</div>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const csvPath = "eval_summary.csv";
    let allRows = [];
    let sortKey = "run";
    let sortDirection = 1;
    let refreshTimer = null;

    const els = {
      status: document.getElementById("status"),
      lastUpdated: document.getElementById("last-updated"),
      rowCount: document.getElementById("row-count"),
      runToggle: document.getElementById("run-toggle"),
      runPanel: document.getElementById("run-panel"),
      datasetToggle: document.getElementById("dataset-toggle"),
      datasetPanel: document.getElementById("dataset-panel"),
      searchFilter: document.getElementById("search-filter"),
      refreshInterval: document.getElementById("refresh-interval"),
      rows: document.getElementById("rows"),
      metricRuns: document.getElementById("metric-runs"),
      metricBenchmarks: document.getElementById("metric-benchmarks"),
      metricSamples: document.getElementById("metric-samples"),
      metricAccuracy: document.getElementById("metric-accuracy"),
    };

    function parseTsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (!lines.length) return [];
      const headers = lines[0].split("\t");
      return lines.slice(1).map((line) => {
        const values = line.split("\t");
        return Object.fromEntries(headers.map((header, idx) => [header, values[idx] ?? ""]));
      });
    }

    function numberValue(row, key) {
      const value = Number(row[key]);
      return Number.isFinite(value) ? value : 0;
    }

    function formatAccuracy(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "-";
      return `${(num * 100).toFixed(2)}%`;
    }

    function formatInteger(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num.toLocaleString() : "0";
    }

    function formatTimestamp(value) {
      const num = Number(value);
      if (!Number.isFinite(num) || num <= 0) return "";
      return new Date(num * 1000).toLocaleString();
    }

    function checkedValues(panel) {
      return [...panel.querySelectorAll("input[type=checkbox]:checked")].map((cb) => cb.value);
    }

    function updateToggleLabel(toggle, checked, allLabel) {
      toggle.textContent = checked.length === 0 ? allLabel : checked.join(", ");
    }

    function buildCheckboxPanel(panel, toggle, values, allLabel, previousChecked) {
      panel.innerHTML = "";
      values.forEach((value) => {
        const lbl = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = value;
        cb.checked = previousChecked.has(value);
        cb.addEventListener("change", () => {
          updateToggleLabel(toggle, checkedValues(panel), allLabel);
          render();
        });
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(value));
        panel.appendChild(lbl);
      });
      updateToggleLabel(toggle, checkedValues(panel), allLabel);
    }

    function setupDropdown(toggle, panel) {
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = panel.classList.contains("open");
        document.querySelectorAll(".cb-panel.open").forEach((p) => p.classList.remove("open"));
        if (!isOpen) panel.classList.add("open");
      });
    }

    setupDropdown(els.runToggle, els.runPanel);
    setupDropdown(els.datasetToggle, els.datasetPanel);

    document.addEventListener("click", () => {
      document.querySelectorAll(".cb-panel.open").forEach((p) => p.classList.remove("open"));
    });

    function applySummaryText(text, sourceLabel) {
      allRows = parseTsv(text);

      const prevRuns = new Set(checkedValues(els.runPanel));
      const prevDatasets = new Set(checkedValues(els.datasetPanel));

      buildCheckboxPanel(
        els.runPanel, els.runToggle,
        [...new Set(allRows.map((row) => row.run))].sort(),
        "All runs", prevRuns
      );
      buildCheckboxPanel(
        els.datasetPanel, els.datasetToggle,
        [...new Set(allRows.map((row) => row.dataset))].sort(),
        "All benchmarks", prevDatasets
      );

      els.status.textContent = `Loaded ${sourceLabel}`;
      els.status.className = "";
      els.lastUpdated.textContent = `Refreshed ${new Date().toLocaleTimeString()}`;
      render();
    }

    async function loadSummary() {
      try {
        const response = await fetch(`${csvPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        applySummaryText(await response.text(), csvPath);
      } catch (error) {
        els.status.textContent = `Could not load ${csvPath}: ${error.message}`;
        els.status.className = "status-error";
      }
    }

    function visibleRunsAndBenchmarks() {
      const selectedRuns = new Set(checkedValues(els.runPanel));
      const selectedDatasets = new Set(checkedValues(els.datasetPanel));
      const search = els.searchFilter.value.trim().toLowerCase();

      const filtered = allRows.filter((row) => {
        if (selectedRuns.size && !selectedRuns.has(row.run)) return false;
        if (selectedDatasets.size && !selectedDatasets.has(row.dataset)) return false;
        return true;
      });

      const runs = [...new Set(filtered.map((r) => r.run))].sort();
      const benchmarks = [...new Set(filtered.map((r) => r.dataset))].sort();

      // Build lookup: run -> dataset -> row
      const lookup = {};
      filtered.forEach((row) => {
        if (!lookup[row.run]) lookup[row.run] = {};
        lookup[row.run][row.dataset] = row;
      });

      // Apply search across run name + accuracy values
      const pivotRows = runs
        .filter((run) => {
          if (!search) return true;
          const text = [run, ...benchmarks.map((b) => lookup[run]?.[b]?.accuracy ?? "")].join(" ").toLowerCase();
          return text.includes(search);
        })
        .sort((a, b) => {
          if (sortKey === "run") {
            return sortDirection * a.localeCompare(b);
          }
          const la = numberValue(lookup[a]?.[sortKey] ?? {}, "accuracy");
          const ra = numberValue(lookup[b]?.[sortKey] ?? {}, "accuracy");
          if (la < ra) return -sortDirection;
          if (la > ra) return sortDirection;
          return 0;
        });

      return { pivotRows, benchmarks, lookup, filtered };
    }

    function renderMetrics({ pivotRows, benchmarks, filtered }) {
      const samples = filtered.reduce((s, r) => s + numberValue(r, "samples"), 0);
      const correct = filtered.reduce((s, r) => s + numberValue(r, "correct"), 0);
      const accuracy = samples > 0 ? correct / samples : NaN;

      els.metricRuns.textContent = pivotRows.length.toLocaleString();
      els.metricBenchmarks.textContent = benchmarks.length.toLocaleString();
      els.metricSamples.textContent = samples.toLocaleString();
      els.metricAccuracy.textContent = formatAccuracy(accuracy);
      els.rowCount.textContent = `${pivotRows.length.toLocaleString()} runs · ${benchmarks.length.toLocaleString()} benchmarks`;
    }

    function renderHeader(benchmarks) {
      const tr = document.createElement("tr");
      const runTh = document.createElement("th");
      runTh.textContent = "Run";
      runTh.dataset.sort = "run";
      tr.appendChild(runTh);
      benchmarks.forEach((b) => {
        const th = document.createElement("th");
        th.className = "num";
        th.textContent = b;
        th.dataset.sort = b;
        tr.appendChild(th);
      });
      // Update sort indicators
      tr.querySelectorAll("th").forEach((th) => {
        if (th.dataset.sort === sortKey) {
          th.textContent += sortDirection === 1 ? " ▲" : " ▼";
        }
        th.addEventListener("click", () => {
          if (sortKey === th.dataset.sort) {
            sortDirection *= -1;
          } else {
            sortKey = th.dataset.sort;
            sortDirection = 1;
          }
          render();
        });
      });
      document.getElementById("thead").innerHTML = "";
      document.getElementById("thead").appendChild(tr);
    }

    function render() {
      const state = visibleRunsAndBenchmarks();
      renderMetrics(state);
      renderHeader(state.benchmarks);

      // Max accuracy per benchmark across visible rows
      const maxAcc = {};
      state.benchmarks.forEach((b) => {
        let best = -Infinity;
        state.pivotRows.forEach((run) => {
          const v = Number(state.lookup[run]?.[b]?.accuracy);
          if (Number.isFinite(v) && v > best) best = v;
        });
        maxAcc[b] = best;
      });

      els.rows.innerHTML = "";
      state.pivotRows.forEach((run) => {
        const tr = document.createElement("tr");
        let html = `<td>${run}</td>`;
        state.benchmarks.forEach((b) => {
          const row = state.lookup[run]?.[b];
          const acc = Number(row?.accuracy);
          const isBest = Number.isFinite(acc) && acc === maxAcc[b];
          const style = isBest ? " style=\"font-weight:700\"" : "";
          html += `<td class="num"${style}>${row ? formatAccuracy(row.accuracy) : "-"}</td>`;
        });
        tr.innerHTML = html;
        els.rows.appendChild(tr);
      });
    }

    function resetRefreshTimer() {
      if (refreshTimer) clearInterval(refreshTimer);
      const interval = Number(els.refreshInterval.value);
      if (interval > 0) {
        refreshTimer = setInterval(loadSummary, interval);
      }
    }

    els.searchFilter.addEventListener("input", render);
      els.refreshInterval.addEventListener("change", resetRefreshTimer);

    loadSummary();
    resetRefreshTimer();
  </script>
</body>
</html>
